[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "multitenant-lifecycle-service"
version = "0.1.0"
description = "A standard Python project configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"] 

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest is built on assert
"tests/**" = ["S101"]
# random drives backoff jitter and the simulated worker, nothing cryptographic
"app/sqs.py" = ["S311"]
"app/worker.py" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
