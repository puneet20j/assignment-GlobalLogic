include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}


messages-storage {
  enabled = true
}

queues {
  tasks {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "tasks-dlq"
      maxReceiveCount = 5
    }
  }
  tasks-dlq {}

  task-updates {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue {
      name = "task-updates-dlq"
      maxReceiveCount = 5
    }
  }
  task-updates-dlq {}
}


