name: control-plane-todo

x-app: &app
  build: .
  image: control-plane-todo:dev
  environment: &env
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
    SQS_ENDPOINT_URL: http://elasticmq:9324
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
      - mqdata:/data
    ports:
      - "9326:9325"

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started

  aws:
    image: amazon/aws-cli:2.27.0
    profiles: ["tools"]
    environment:
      AWS_ENDPOINT_URL: http://elasticmq:9324
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

volumes:
  pgdata:
  mqdata:
